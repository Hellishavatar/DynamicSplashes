[Features]
# Ripples: jumping or falling into water leaves a fading inner ripple and an outer ring, sized by fall speed and stretched along your movement.
bRipples = true

# Jump-Out Splashes: jumping out of water gives a splash with spray, sound and ripples where you push off.
bJumpOutSplashes = true

# Missed Splashes: adds the splash the game skips on some of your landings, such as deep-water jumps.
bMissedSplashes = true
